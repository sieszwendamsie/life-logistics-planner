# Fake example data. Copy to data/ and replace with real values.
horizon:
  start: 2027-01-10
  end: 2027-06-30

# Last day back in Poznań after the previous stay.
last_return: 2026-12-27

stay_rules:
  min_stay_days: 21
  max_stay_days: 28
  min_gap_days: 28
  max_gap_days: 35

office_required:
  - {start: 2027-02-01, end: 2027-02-05}

poznan_required:
  - {start: 2027-03-15, end: 2027-03-16}

family:
  - {start: 2027-02-20, end: 2027-03-07, mode: together}

# If the family house is not free, Martin can stay alone elsewhere for up to this many days.
solo_max_days: 7

# Other trips (holidays, business travel). The car is not used near these.
other_travel:
  - {start: 2027-02-25, end: 2027-02-27}

travel:
  direct_only: true
  # Best first. Written from Poznań's side; return flights use the same routes reversed.
  route_tiers:
    - name: Poznań to Bologna, Rimini or Forlì
      origins: [POZ]
      destinations: [BLQ, RMI, FRL]
    - name: Poznań to another airport in northern or central Italy
      origins: [POZ]
      destinations: [TSF, VCE, VRN, BGY, FLR, PSA]
    - name: Wrocław, Warsaw Chopin or Berlin to Bologna
      origins: [WRO, WAW, BER]
      destinations: [BLQ]
  # Hours between each airport and home (Poznań or Faenza). Rough example values.
  transfer_hours:
    {POZ: 0.5, WRO: 2.5, WAW: 3.5, BER: 3, BLQ: 1, RMI: 1, FRL: 0.5,
     TSF: 2.5, VCE: 2.5, VRN: 2.5, BGY: 3, FLR: 1.5, PSA: 2.5}
  car:
    drive_hours: 13
    min_stay_days: 21
    clear_days: 7
  # Paula and Basia: weekend flights between 10:00 and 18:00 preferred. Their flight
  # day can move up to shift_days into the stay to get there. Soft rules.
  family_flights: {weekend: true, earliest: "10:00", latest: "18:00", shift_days: 4}
  # Try not to fly on long weekends in Poland or Italy (dearer). Soft rule.
  avoid_long_weekends: true

# Public holidays (Martin prefers to be in Poland on them; soft rule).
holidays:
  - {day: 2027-03-29, country: PL, name: Easter Monday}
  - {day: 2027-04-25, country: IT, name: Liberation Day}
# Office closed (#shutdown) and Martin's own leave (#holiday, blocks a work stay).
shutdown:
  - {start: 2027-08-13, end: 2027-08-22}
leave: []

# 3-way trip: uncomment when the stay you are planning ends by flying on to another
# country (for example the UK) and then home from there. The car is not used then.
# Journeys use direction: onward (Italy to UK) and direction: home (UK to Poland).
# onward:
#   name: UK family visit
#   airports: [LTN, STN, LGW, LHR, BRS]
#   nights: 7
